[package]
name = "languagetool-rs"
version = "0.1.0"
edition = "2021"
authors = ["LanguageTool Contributors"]
description = "A style and grammar checker - Rust implementation"
license = "LGPL-2.1-or-later"
repository = "https://github.com/awcook97/languagetool"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
